<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kg-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0" />
      <stop offset="10%" stop-color="#00e5a0" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#00d4ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="kg-top2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0" />
      <stop offset="18%" stop-color="#00e5a0" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#00d4ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0" />
    </linearGradient>
    <filter id="kgl-top">
      <feGaussianBlur stdDeviation="2.5" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Primary keystroke trace: taps and holds, like a key-press timing diagram -->
  <polyline
    points="
      4,24 14,24 14,10 24,10 24,24 32,24 32,15 41,15 41,24 55,24 55,7 73,7 73,24
      81,24 89,13 97,13 97,24 109,24 109,17 117,17 117,24 133,24 133,9 149,9 149,24
      157,24 165,14 173,14 173,24 187,24 187,18 194,18 194,24 209,24 209,8 227,8 227,24
      235,24 243,13 251,13 251,24 263,24 263,16 271,16 271,24 296,24"
    fill="none"
    stroke="url(#kg-top)"
    stroke-width="1.5"
    stroke-linejoin="bevel"
    filter="url(#kgl-top)"
  />

  <!-- Secondary keystroke trace -->
  <polyline
    points="
      4,31 20,31 20,36 36,36 36,31 58,31 58,39 78,39 78,31 100,31 100,35 118,35 118,31
      140,31 140,38 160,38 160,31 184,31 184,36 204,36 204,31 228,31 228,39 248,39 248,31
      270,31 270,35 296,35"
    fill="none"
    stroke="url(#kg-top2)"
    stroke-width="1"
    stroke-linejoin="bevel"
  />

  <!-- Wordmark -->
  <text x="150" y="76" text-anchor="middle" font-family="'Courier New', 'Courier', monospace" font-size="48" font-weight="700" fill="#e8e8ee">
    key<tspan fill="#b8ff00">fly</tspan>
  </text>

  <!-- Tagline -->
  <text x="150" y="100" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" fill="#55556a">
    layouts &#183; keymaps &#183; motion
  </text>
</svg>
