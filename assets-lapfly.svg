<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tg-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0" />
      <stop offset="10%" stop-color="#00e5a0" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#00d4ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="tg-top2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0" />
      <stop offset="18%" stop-color="#00e5a0" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#00d4ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0" />
    </linearGradient>
    <filter id="gl-top">
      <feGaussianBlur stdDeviation="2.5" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Primary telemetry trace -->
  <polyline
    points="
      4,24 12,24 18,14 24,32 28,8 34,34 38,18 46,24 52,6 58,30 64,18 72,10 78,30 86,8 94,24
      102,18 108,6 116,28 122,20 130,14 136,30 142,10 150,24 156,16 164,28 170,8 176,22 182,14
      192,30 198,12 206,24 212,18 220,16 226,26 232,14 238,24 244,20 250,24 256,22 262,24
      268,23 274,24 282,24 296,24"
    fill="none"
    stroke="url(#tg-top)"
    stroke-width="1.5"
    stroke-linejoin="bevel"
    filter="url(#gl-top)"
  />

  <!-- Secondary telemetry trace -->
  <polyline
    points="
      4,30 16,30 24,36 32,24 40,32 48,38 54,26 62,34 70,28 78,36 86,22 94,32 102,38 110,26
      118,34 126,30 134,38 142,24 150,32 158,36 166,28 174,34 182,40 190,26 198,34 206,30
      214,36 222,26 230,32 236,30 242,32 248,31 254,32 262,31 270,32 278,32 288,32 296,32"
    fill="none"
    stroke="url(#tg-top2)"
    stroke-width="1"
    stroke-linejoin="bevel"
  />

  <!-- Wordmark -->
  <text x="150" y="76" text-anchor="middle" font-family="'Courier New', 'Courier', monospace" font-size="48" font-weight="700" fill="#e8e8ee">
    lap<tspan fill="#b8ff00">fly</tspan>
  </text>

  <!-- Tagline -->
  <text x="150" y="100" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" letter-spacing="3" fill="#55556a">
    less noise, more speed
  </text>
